# MySQL only. Run from backend-go/. Frontend and Go API stay on the host.
# Start: docker compose up -d
# Stop:  docker compose down
# Wipe:  docker compose down -v

services:
  mysql:
    image: mysql:8.0
    container_name: tickpulse-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend-go/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tickpulse_db}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=1
    volumes:
      - tickpulse_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  tickpulse_mysql_data:
